# Context blocks assembled into kickoff messages (spec/03 §10) or included by tasks.

[[prompt]]
key = "block.settings.outline"
kind = "block"
agent = "shared"
vars = ["book", "settings"]
title_en = "Block — setting materials: outline"
title_zh = "上下文 · 设定资料：故事大纲"
text = '''# 设定资料

本书：《{{ book.title }}》{% if book.genre %}　类型：{{ book.genre }}{% endif %}

本书写作语言：{{ book.writing_language_name }}。正文、章纲、摘要、档案等一切产出都必须使用该语言。

以下是作者审定的设定资料，是本书创作的根本依据。每份文档包在标签中，标签内的标题属于文档本身。

## 一、故事大纲
<book_outline>
{{ settings.outline or "（尚未填写）" }}
</book_outline>

'''

[[prompt]]
key = "block.settings.characters"
kind = "block"
agent = "shared"
vars = ["book", "settings"]
title_en = "Block — setting materials: characters"
title_zh = "上下文 · 设定资料：人物设定"
text = '''## 二、人物设定（按重要性排序）
{% for c in settings.characters %}
<character rank="{{ c.rank }}" name="{{ c.name }}"{% if c.role_label %} role="{{ c.role_label }}"{% endif %}>
{% if c.summary %}{{ c.summary }}
{% endif %}{% if c.profile %}
{{ c.profile }}
{% endif %}
</character>
{% else %}
（尚未填写）
{% endfor %}

'''

[[prompt]]
key = "block.settings.world"
kind = "block"
agent = "shared"
vars = ["book", "settings"]
title_en = "Block — setting materials: world"
title_zh = "上下文 · 设定资料：世界观"
text = '''## 三、世界观
<world_setting>
{{ settings.world or "（尚未填写）" }}
</world_setting>

'''

[[prompt]]
key = "block.settings.protagonist"
kind = "block"
agent = "shared"
vars = ["book", "settings"]
title_en = "Block — setting materials: protagonist"
title_zh = "上下文 · 设定资料：主角详细设定"
text = '''## 四、主角详细设定
<protagonist_profile>
{{ settings.protagonist or "（尚未填写）" }}
</protagonist_profile>
{% if settings.scopes %}

## 可检索的知识库范围
{% for s in settings.scopes %}- {{ s.name }}{% if s.description %}：{{ s.description }}{% endif %}

{% endfor %}{% endif %}
'''

[[prompt]]
key = "block.writing_skills"
kind = "block"
agent = "shared"
vars = ["skills"]
title_en = "Block — writing skills"
title_zh = "上下文 · 写作技能"
text = '''
{% if skills %}# 写作技能（写作方法指令）

以下是作者为本书选择的写作技能，正文写作与修订时必须遵循。

**注意**：每段技能正文都是关于“怎么写”的**指令文本**，不是本书的设定资料、正史记录或剧情内容。不要把它当作世界观事实，也不要照搬其中的示例文字。
如果技能要求与本书设定资料冲突，以设定资料为准；作者在当前会话中的明确要求优先于技能。

{% for s in skills %}
<writing_skill name="{{ s.name }}"{% if s.category %} category="{{ s.category }}"{% endif %}>
{{ s.body }}
</writing_skill>
{% endfor %}
{% endif %}
'''

[[prompt]]
key = "block.memory.recent"
kind = "block"
agent = "shared"
vars = ["memory", "chapter", "systems"]
title_en = "Block — memory: recent chapters and outline"
title_zh = "上下文 · 记忆：近期章节与章纲"
text = '''# 记忆

## 短期记忆
当前任务：{{ chapter.label }}{% if chapter.title %}《{{ chapter.title }}》{% endif %}

{% if systems.memory %}{% if memory.is_first and chapter.number == 1 %}
这是本书（本轨道）的第一章，暂无前文。
{% elif memory.is_first %}
前面的章节都还没有定稿，记忆中暂无前文；本章并不是本书（本轨道）的第一章。
{% else %}
### 近期章节摘要（由远及近）
{% for s in memory.recent_summaries %}- {{ s.label }}{% if s.title %}《{{ s.title }}》{% endif %}：{{ s.summary or "（尚无摘要）" }}
{% endfor %}{% if memory.previous_tail %}
### 上一章结尾（{{ memory.previous_tail.label }}）
{{ memory.previous_tail.text }}
{% endif %}{% endif %}{% endif %}'''

[[prompt]]
key = "block.memory.entities"
kind = "block"
agent = "shared"
vars = ["memory", "chapter", "systems"]
title_en = "Block — memory: entities"
title_zh = "上下文 · 记忆：实体"
text = '''{% if systems.entities %}{% if memory.protagonist %}
### 主角当前状态：{{ memory.protagonist.name }}(#{{ memory.protagonist.id }}){% if memory.protagonist.status != "active" %}【{{ memory.protagonist.status_label }}】{% endif %}

{% if memory.protagonist.after_anchor %}（这是正文锚点之后的状态，对本番外可能尚不成立，请结合锚点判断。）
{% endif %}{{ memory.protagonist.state or "（尚无记录）" }}
{% if memory.protagonist.attributes %}{% for a in memory.protagonist.attributes %}{{ a.key }}：{{ a.value }}{% if not loop.last %}；{% endif %}{% endfor %}

{% endif %}{% endif %}{% endif %}{% if chapter.outline %}
### 本章章纲
<chapter_outline>
{{ chapter.outline }}
</chapter_outline>
{% endif %}

{% if systems.entities %}## 中期记忆（近 {{ memory.window_mid }} 章）
{% if memory.recent_changes %}
### 近期状态与关系变化
{% for c in memory.recent_changes %}- {{ c.chapter_label }} · {{ c.target }}：{{ c.note }}
{% endfor %}{% else %}
近期没有记录到状态或关系变化。
{% endif %}{% if memory.appearances %}
### 人物出场记录
{% for a in memory.appearances %}- {{ a.name }}(#{{ a.id }})：{{ a.count }} 次（{% for i in a.chapters %}{{ i.label }}·{{ i.role_label }}{% if not loop.last %}、{% endif %}{% endfor %}）
{% endfor %}{% endif %}{% if memory.absent_important %}
### 久未出场的重要人物
{% for a in memory.absent_important %}- {{ a.name }}(#{{ a.id }})：最近出场于{{ a.last_label }}
{% endfor %}{% endif %}{% endif %}

'''

[[prompt]]
key = "block.memory.facts"
kind = "block"
agent = "shared"
vars = ["memory", "chapter", "systems"]
title_en = "Block — memory: facts and world rules"
title_zh = "上下文 · 记忆：核心事实与世界规则"
text = '''{% if systems.entities or systems.memory or systems.foreshadowing or systems.timeline %}## 长期记忆索引（详情请用工具检索）
{% if systems.memory and memory.key_notes %}
### 核心事实与世界规则
{% for n in memory.key_notes %}- [{{ n.kind_label }}#{{ n.id }}] {{ n.content }}
{% endfor %}{% endif %}{% endif %}'''

[[prompt]]
key = "block.memory.foreshadowing"
kind = "block"
agent = "shared"
vars = ["memory", "chapter", "systems"]
title_en = "Block — memory: foreshadowing"
title_zh = "上下文 · 记忆：未回收的伏笔"
text = '''{% if systems.entities or systems.memory or systems.foreshadowing or systems.timeline %}{% if systems.foreshadowing and memory.open_foreshadowing %}
### 未回收的伏笔
{% for f in memory.open_foreshadowing %}- #{{ f.id }} {{ f.title }}（埋于{{ f.planted_label }}）
{% endfor %}{% endif %}{% if systems.entities and memory.cast %}
### 主要实体
{% for e in memory.cast %}- #{{ e.id }} {{ e.name }}【{{ e.kind_label }}】{% if e.summary %}— {{ e.summary }}{% endif %}

{% endfor %}{% endif %}
{% if systems.entities or systems.timeline or systems.memory or systems.foreshadowing %}档案规模：{% if systems.entities %}人物 {{ memory.counts.character }}，组织 {{ memory.counts.organization }}，地点 {{ memory.counts.location }}，物品 {{ memory.counts.item }}，其他 {{ memory.counts.other }}{% endif %}{% if systems.timeline %}{% if systems.entities %}；{% endif %}时间线事件 {{ memory.counts.event }}{% if memory.counts.event_planned %}（其中计划中 {{ memory.counts.event_planned }}）{% endif %}{% endif %}{% if systems.memory %}{% if systems.entities or systems.timeline %}；{% endif %}事实 {{ memory.counts.fact }}，世界规则 {{ memory.counts.world_rule }}{% endif %}{% if systems.foreshadowing %}{% if systems.entities or systems.timeline or systems.memory %}；{% endif %}未回收伏笔 {{ memory.counts.foreshadowing_open }}{% endif %}。{% endif %}{% endif %}
'''

[[prompt]]
key = "block.recent_chapters"
kind = "block"
agent = "shared"
vars = ["chapters"]
title_en = "Block — recent chapters in full"
title_zh = "上下文 · 最近章节正文"
text = '''
{% if chapters %}# 最近章节正文

以下是本章之前最近的已定稿章节正文，按时间顺序排列。它们用于保持**连续性**：事件、场景状态、人物状态与叙述声音都应与它们衔接。

- **写作方法优先**：这些正文只用于衔接，不要照抄其中的措辞、句式或比喻；与本章细纲或作者的当前要求不一致时，以细纲和作者的要求为准。
- **这些章节已经全文附在下面**，不要再调用 read_chapter 阅读它们，否则每次写作都会多付一次重复调用的代价。
- 如果某一章的标签带有 `partial="true"`，说明只保留了该章的**结尾**、省略了开头；不要把它当作章节的起始场景。

{% for c in chapters %}
<chapter_text number="{{ c.number }}" label="{{ c.label }}"{% if c.title %} title="{{ c.title }}"{% endif %}{% if c.partial %} partial="true"{% endif %}>
{% if c.partial %}（节选：省略了本章开头，以下只保留结尾部分。）
{% endif %}{{ c.text }}
</chapter_text>
{% endfor %}
{% endif %}
'''

[[prompt]]
key = "block.chapter_draft"
kind = "block"
agent = "shared"
vars = ["chapter", "draft"]
title_en = "Block — chapter outline, notes and text"
title_zh = "上下文 · 本章章纲与正文"
text = '''
# 本章正文（{{ chapter.label }}{% if chapter.title %}《{{ chapter.title }}》{% endif %}）
{% if chapter.outline %}
## 章纲
<chapter_outline>
{{ chapter.outline }}
</chapter_outline>
{% endif %}{% if chapter.reference_notes %}
## 参考要点
<reference_notes>
{{ chapter.reference_notes }}
</reference_notes>
{% endif %}
## 正文（共 {{ draft.paragraph_count }} 段，{{ draft.word_count }} 字）
<chapter_text>
{% for p in draft.paragraphs %}[{{ p.pid }}] {{ p.text }}{% if loop.last and draft.tail_open %}（本段未完）{% endif %}

{% else %}（暂无正文）
{% endfor %}
</chapter_text>
'''

[[prompt]]
key = "block.cast_index"
kind = "block"
agent = "archivist"
vars = ["cast_index"]
title_en = "Block — entity index for maintenance"
title_zh = "上下文 · 实体索引"
text = '''
# 实体索引（维护时请复用已有实体，不要重复创建）
{% for e in cast_index %}- #{{ e.id }} {{ e.name }}【{{ e.kind_label }}】{% if e.aliases %}（别名：{{ e.aliases | join("、") }}）{% endif %}{% if e.status != "active" %}［{{ e.status_label }}］{% endif %}{% if e.summary %} — {{ e.summary }}{% endif %}

{% else %}（档案中还没有任何实体）
{% endfor %}
'''

[[prompt]]
key = "block.chapter_diff"
kind = "block"
agent = "archivist"
vars = ["chapter", "diff"]
title_en = "Block — text changes since canon sync"
title_zh = "上下文 · 正文变更"
text = '''
# 正文变更（{{ chapter.label }}，建档版本 → 当前版本）
{% for d in diff.changes %}{% if d.op == "insert" %}- 新增 {{ d.pid }}（{% if d.after %}位于 {{ d.after }} 之后{% else %}位于开头{% endif %}）：{{ d.new }}
{% elif d.op == "delete" %}- 删除 {{ d.pid }}：{{ d.old }}
{% else %}- 修改 {{ d.pid }}：
  原文：{{ d.old }}
  现文：{{ d.new }}
{% endif %}{% else %}（没有检测到变更）
{% endfor %}
'''

[[prompt]]
key = "block.anchor"
kind = "block"
agent = "shared"
vars = ["track"]
title_en = "Block — side story notice"
title_zh = "上下文 · 番外说明"
text = '''
【番外说明】本章属于番外《{{ track.title }}》{% if track.canon_mode == "isolated" %}（独立番外：可以读取正史的设定与记录，但本番外中发生的事件不会改变正史）{% else %}（正史番外：其中发生的事件属于正史）{% endif %}。
{% if track.synopsis %}番外梗概：{{ track.synopsis }}
{% endif %}{% if track.anchor_kind == "after_chapter" %}时间锚点：发生在{{ track.anchor_label }}之后。锚点之后的正文事件，对本番外中的角色而言尚未发生；检索结果中标注“（锚点之后）”的内容，角色不能知晓，也不能提前发生。
{% elif track.anchor_kind == "before_start" %}时间锚点：发生在正文开始之前，正文中的所有事件都尚未发生。
{% elif track.anchor_kind == "after_end" %}时间锚点：发生在正文完结之后。
{% endif %}
'''

[[prompt]]
key = "block.book_brief"
kind = "block"
agent = "researcher"
vars = ["book"]
title_en = "Block — book brief for research"
title_zh = "上下文 · 所属作品简介"
text = '''
# 所属作品
《{{ book.title }}》{% if book.genre %}（{{ book.genre }}）{% endif %}，写作语言：{{ book.writing_language_name }}
{% if book.idea %}作品构想：{{ book.idea }}
{% endif %}请让收集的资料服务于这部作品的创作需要。
'''

[[prompt]]
key = "block.canon_systems"
kind = "block"
agent = "shared"
vars = ["systems"]
title_en = "Block — disabled canon systems"
title_zh = "上下文 · 未启用的档案系统"
text = '''
{% if not systems.entities or not systems.timeline or not systems.memory or not systems.foreshadowing %}# 未启用的档案系统

本书关闭了以下档案系统。它们的记录不会出现在上下文中，相关工具不会出现在工具列表中，search_canon 也不会返回它们的内容；如果某个工具的 entities 参数属于已关闭的实体系统，请保持为空。
{% if not systems.entities %}
- 实体：人物、组织、地点、物品、关系与出场记录均不可用。
{% endif %}{% if not systems.timeline %}
- 时间线：事件记录与时间顺序查询不可用；伏笔不能指定回收锚点。
{% endif %}{% if not systems.memory %}
- 记忆：章节摘要、笔记与前后文记忆不可用。
{% endif %}{% if not systems.foreshadowing %}
- 伏笔：已埋设的伏笔与回收状态不可用。
{% endif %}{% endif %}
'''

[[prompt]]
key = "block.goals"
kind = "block"
agent = "shared"
vars = ["goals", "systems"]
title_en = "Block — writing goals"
title_zh = "上下文 · 写作目标"
text = '''
{% if goals.nodes %}# 写作目标

以下是作者为本章设置的相关写作目标。每个目标的 purpose 说明它为何存在、要达成什么；大纲与正文必须服务于任务的目的，目的应通过故事实现，绝不在正文中直接说明。审查者会判断本章是否服务于这些目标；档案员按节点编号引用目标。

{% for node in goals.nodes %}<{{ node.level }} id="{{ node.id }}"{% if node.parent_id %} parent="{{ node.parent_id }}"{% endif %} title="{{ node.title }}"{% if node.chapters %} chapters="{{ node.chapters }}"{% endif %}{% if node.overdue %} overdue="true"{% endif %}>
<purpose>{{ node.purpose }}</purpose>
{% if node.entities %}<entities>{{ node.entities | join("、") }}</entities>
{% endif %}{% if node.events %}<events>{{ node.events | join("、") }}</events>
{% endif %}{% if node.foreshadowing %}<foreshadowing>{{ node.foreshadowing | join("、") }}</foreshadowing>
{% endif %}</{{ node.level }}>
{% endfor %}{% if goals.omitted %}还有 {{ goals.omitted }} 个相关目标未显示。
{% endif %}{% endif %}
'''

[[prompt]]
key = "block.book_index"
kind = "block"
agent = "assistant"
vars = ["index"]
title_en = "Block — the book index"
title_zh = "上下文 · 全书索引"
text = '''
【全书索引】
{% for track in index.tracks %}
- 轨道：{% if track.label %}{{ track.label }}{% else %}主线{% endif %}（{{ track.kind }}）
{% for chapter in track.chapters %}  第{{ chapter.number }}章{% if chapter.title %}《{{ chapter.title }}》{% endif %}：{{ chapter.status }}，{{ chapter.words }} 字，档案 {{ chapter.canon_status }}
{% endfor %}{% endfor %}
{% if index.chapters_omitted %}更早的章节还有 {{ index.chapters_omitted }} 章未列出。
{% endif %}
设定文档：
{% for doc in index.setting_docs %}- {{ doc.label }}：{{ doc.characters }} 字，revision {{ doc.revision }}
{% endfor %}
人物设计（最多列出 30 位）：
{% for character in index.characters %}- #{{ character.rank }} {{ character.name }}（{{ character.role_label }}）
{% endfor %}{% if index.characters_omitted %}（另有 {{ index.characters_omitted }} 位未列出。）
{% endif %}
档案统计：实体 {{ index.canon.entities }}，时间线 {{ index.canon.timeline }}，记忆 {{ index.canon.memory }}，伏笔 {{ index.canon.foreshadowing }}，目标 {{ index.canon.goals }}。
目标：未完成 {{ index.goals.open }}，可推进 {{ index.goals.ready }}。
资料任务：
{% for item in index.research %}- {{ item.status }}：{{ item.count }}
{% endfor %}
打开中的会话：
{% for session in index.sessions %}- #{{ session.id }} {{ session.kind }}（{{ session.status }}）
{% endfor %}{% if index.sessions_omitted %}（另有 {{ index.sessions_omitted }} 个未列出。）
{% endif %}
待处理提案：
{% for proposal in index.proposals %}- #{{ proposal.id }} {{ proposal.target_type }}{% if proposal.target_kind %} / {{ proposal.target_kind }}{% endif %}
{% endfor %}{% if index.proposals_omitted %}（另有 {{ index.proposals_omitted }} 个未列出。）
{% endif %}
{% if index.off_systems %}已关闭的档案系统：{{ index.off_systems | join("、") }}。
{% endif %}
'''
