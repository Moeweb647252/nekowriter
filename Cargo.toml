[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
# Internal crates
nekowriter = { path = "crates/server", default-features = false }
nekowriter-llm = { path = "crates/llm" }
nekowriter-embed = { path = "crates/embed" }
nekowriter-migration = { path = "crates/migration" }

# Runtime and web
tokio = { version = "1.54", features = ["full"] }
axum = { version = "0.8.9", features = ["macros"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "fs", "set-header"] }
futures = "0.3"
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }

# Persistence
sea-orm = { version = "2.0.4", default-features = false, features = [
  "macros",
  "with-json",
  "with-chrono",
  "sqlx-sqlite",
  "runtime-tokio",
  "sqlite-use-returning-for-3_35",
] }
sea-orm-migration = { version = "2.0.4", default-features = false, features = [
  "sqlx-sqlite",
  "runtime-tokio",
] }
sqlite-vec = "0.1.9"

# HTTP clients and streaming
reqwest = { version = "0.13", features = ["json", "stream"] }
eventsource-stream = "0.2"

# Serialization and format
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
minijinja = { version = "3.0", features = ["serde", "json", "loop_controls"] }
ts-rs = { version = "12", features = ["chrono-impl", "serde-json-impl"] }
chrono = { version = "0.4", features = ["serde"] }

# Embeddings
fastembed = { version = "7.5", default-features = false, features = [
  "onnx",
  "ort-download-binaries-rustls-tls",
  "hf-hub-rustls-tls",
] }

# Errors, logging, CLI
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
clap = { version = "4", features = ["derive", "env"] }
directories = "6"
dotenvy = "0.15"
rust-embed = "8"

# Text, search, misc
jieba-rs = "0.11"
unicode-segmentation = "1.13"
similar = "3"
jsonschema = { version = "0.60", default-features = false }
async-trait = "0.1"
blake3 = "1.8"
dom_smoothie = "0.18"
htmd = "0.5"
encoding_rs = "0.8"
url = "2"
ipnet = "2"

# Dev
tempfile = "3"
insta = { version = "1.49", features = ["json"] }
pretty_assertions = "1.4"
wiremock = "0.6"

[profile.dev]
# Keep debug builds of the dependency tree fast while our own code stays debuggable.
opt-level = 0
debug = 1

[profile.dev.package."*"]
opt-level = 1
