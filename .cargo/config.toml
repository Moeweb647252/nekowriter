# 非 Windows 平台不在这里指定 PROTOC：LanceDB 的构建脚本会在 PATH 上找它，
# 安装方式见 tools/README.md。
[target.x86_64-pc-windows-msvc.env]
# Windows 使用 tools/bootstrap-protoc.ps1 下载的 protoc（LanceDB 0.38 的构建脚本需要）。
PROTOC = { value = "tools/protoc/bin/protoc.exe", relative = true, force = true }

[target.x86_64-pc-windows-msvc]
linker = "lld-link"
rustflags = ["-C", "link-arg=-fuse-ld=lld"]

[alias]
# 构建自动化入口：`cargo xtask package` 组装脱离源码树的发行目录。
xtask = "run --package xtask --"
