# Model-facing text: everything the application tells the model besides the prompts.
# Placeholders such as {{name}} use the template language of
# crates/nekowriter-core/src/template.rs. Every key is required by `ModelText`.

[languages]
"zh-CN" = "简体中文"
en = "英语"

[artifacts]
background = "背景设定"
research = "资料收集"
characters = "人物设定"
outline = "小说粗纲"

[list]
separator = "、"

[chapter_kinds]
main = "正篇"
extra = "番外"

[contracts]
preparation = """
## 提交方式
- 完成后调用 {{tool}} 工具提交，这是结束本阶段的唯一方式。不要在普通文本中输出产物正文或 JSON。
- 每次回复最多调用一个工具。
- artifacts 中每项产物只出现一次，kind 的取值为 background（背景设定）、research（资料收集）、characters（人物设定）、outline（小说粗纲），只提交本轮要求的产物。
- 提交小说粗纲时必须同时提供 chapter_plan：按顺序列出每一章的标题（title）和本章目标（goal）。
- 提交后作者会逐项审核。未通过的产物会附有审核意见，届时只修订并重新提交被要求的产物。"""
chapter_outline = """
## 提交方式
- 大纲写好后调用 {{tool}} 工具提交，chapter_id 填写 {{chapter_id}}。这是结束本阶段的唯一方式，不要在普通文本中输出大纲。
- 每次回复最多调用一个工具。
- 提交后作者会审核大纲。未通过时会附有审核意见，届时根据意见修改，并重新提交完整的大纲。"""
chapter_body = """
## 写作方式
- 正文只能通过工具修改：用 {{append}} 在正文末尾追加内容；用 {{replace}} 把正文中只出现一次的一段文字替换为新文字，新文字为空表示删除。
- {{replace}} 的 old_str 必须与正文逐字一致，并且在正文中只出现一次；否则修改不会生效，正文保持不变。
- 每次回复最多调用一个工具。正文较长时分多次追加，每次追加一段完整的内容。
- 工具结果中的 feedback 是作者在你写作过程中给出的意见，请据此调整之后的写作，必要时修改已写的正文。
- 本章写完并检查无误后，调用 {{submit}} 提交，chapter_id 填写 {{chapter_id}}，summary 用几句话概括本章内容。摘要不会写入正文。
- 提交后作者会审核整章。未通过时会附有审核意见，届时修改正文，然后重新提交本章。"""

