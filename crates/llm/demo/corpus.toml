A border gate usually has two layers: a heavy outer gate against rams and a narrow inner gate for inspection.

- Open at sunrise, closed at sunset; in rain or snow only one small side door stays open.
- Guards change every watch and carry a bronze tally.
- Travelers give name and origin; caravans also show a goods permit.
"""

