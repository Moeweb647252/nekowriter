title = "望川城的城门规制"
content = """# 望川城的城门规制

边城的城门通常分内外两重：外门厚重，用于抵御冲撞；内门较窄，便于盘查。

- 日出开启，日落关闭；雨雪天照旧，但只开一侧小门。
- 守卫按「一更一轮」换值，轮值者腰系铜牌。
- 行人入城需报姓名与来处，商队另验货引。
"""

[[zh.knowledge_entries]]
source_urls = ["https://example.com/zh-research"]
title = "剑器的日常养护"
content = """# 剑器的日常养护

1. 每次用后以布拭去汗渍与雨水，尤其注意剑鞘内侧。
2. 剑锋薄涂一层油，避免锈蚀。
3. 缠绳若松脱，应在阴处晾干后重新缠紧。
"""

