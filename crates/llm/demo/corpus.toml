outline = """# 全书大纲

一个失去师门的剑客，带着一封未拆的旧信，走进了一座正在易主的边城。

## 第一卷：入城
1. 城门口的雨
2. 城楼上的身影
3. 明灯初上

## 主线
寻找师父之死的真相，并在两股势力之间做出选择。
"""
world = """# 世界观

## 地理
- **云岭**：横贯南北的山脉，山口有一座边城「望川」。
- **望川城**：三面环山，一面临水，是商路的咽喉。

## 势力
- **执剑司**：守卫商路的官方武力，近年在城中势力渐弱。
- **青渠会**：以水路为生的行会，行事隐秘。

## 规则
- 剑气可斩断寻常兵刃，但每次使用都会折损人的心脉。
"""
protagonist = """# 主角

**姓名**：沈砚
**身份**：游侠，师门在十年前的一场火中覆灭。
**性格**：寡言，习惯先观察再出手；对旧物有近乎固执的珍惜。
**目标**：拆开师父留下的旧信。
**弱点**：不愿相信他人，因此常常错过真相。
"""

