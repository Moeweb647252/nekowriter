A swordsman without a school walks into a border town that is changing hands, carrying an unopened letter.

## Volume one: Into the town
1. Rain at the gate
2. The figure on the tower
3. Lamps come on

## Throughline
Find out how the master died, and choose between two factions.
"""
world = """# World

## Geography
- **Cloud Ridge**: a mountain range running north to south, with a border town called **Wangchuan** in its pass.
- **Wangchuan**: mountains on three sides, water on the fourth, the throat of the trade road.

## Factions
- **The Sword Office**: the official force guarding the road, lately weaker in town.
- **The Green Canal Society**: a guild living off the waterway, secretive in its dealings.

## Rules
- Sword aura can cut ordinary steel, but every use costs the wielder's heart meridian.
"""
